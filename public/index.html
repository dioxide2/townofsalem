<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salem Nights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="fog"></div>

<section id="home" class="screen active">
  <div class="home-inner">
    <div class="title-emblem" id="titleEmblem"></div>
    <h1 class="game-title">Salem Nights</h1>
    <p class="tagline">A village of secrets. Trust no one after dark.</p>
    <div class="home-card">
      <label>Your Name</label>
      <input id="nameInput" maxlength="16" placeholder="e.g. Goodwife Ann" autocomplete="off"/>
      <div class="home-actions">
        <button id="createBtn" class="btn primary">Create Room</button>
        <div class="join-row">
          <input id="codeInput" maxlength="4" placeholder="CODE" autocomplete="off"/>
          <button id="joinBtn" class="btn">Join</button>
        </div>
      </div>
      <p id="homeError" class="error"></p>
    </div>
    <button id="howToBtn" class="btn ghost" style="margin-top:16px;">📖 How to Play &amp; Roles</button>
    <p class="footnote">An original social-deduction game in the spirit of the Mafia/Werewolf tradition. Play with 7-17 players.</p>
  </div>
</section>

<section id="lobby" class="screen">
  <div class="lobby-inner">
    <h2>The Gathering</h2>
    <div class="room-code-box">Room Code: <span id="roomCode"></span>
      <button id="copyCode" class="btn tiny">Copy</button>
    </div>
    <p class="hint">Share this code with your coworkers. Need 7-15 players.</p>
    <div id="lobbyPlayers" class="lobby-players"></div>
    <button id="startBtn" class="btn primary" disabled>Begin the Trials</button>
    <p id="lobbyHint" class="hint"></p>
    <button id="leaveBtn" class="btn ghost tiny">Leave</button>
  </div>
</section>

<section id="game" class="screen">
  <header id="gameHeader">
    <div class="phase-info">
      <span id="phaseBadge" class="phase-badge">Night 1</span>
      <span id="phaseName">Night falls...</span>
    </div>
    <div id="timer" class="timer">--</div>
  </header>

  <div class="game-body">
    <aside id="rolePanel" class="role-panel">
      <div id="roleEmblem" class="role-emblem-wrap"></div>
      <h3 id="roleName">-</h3>
      <div id="roleTeam" class="role-team"></div>
      <p id="roleSummary" class="role-summary"></p>
      <p id="roleDetail" class="role-detail"></p>
      <div id="roleStats" class="role-stats"></div>
      <div id="allies" class="allies"></div>
      <div id="actionHint" class="action-hint"></div>
    </aside>

    <main class="board">
      <div id="announce" class="announce"></div>
      <div id="trialBox" class="trial-box hidden"></div>
      <div id="villageScene">
        <div class="stars"></div>
        <div class="sky-orb"></div>
        <div class="ground"></div>
        <div id="village" class="village"></div>
        <div id="phaseFlash"></div>
      </div>
      <div id="actionBar" class="action-bar"></div>
    </main>

    <aside class="chat-panel">
      <div id="chatChannel" class="chat-channel">Town Square</div>
      <div id="chatLog" class="chat-log"></div>
      <form id="chatForm" class="chat-form">
        <input id="chatInput" maxlength="300" placeholder="Speak..." autocomplete="off"/>
        <button class="btn tiny" type="submit">Send</button>
      </form>
    </aside>
  </div>
</section>

<section id="over" class="screen">
  <div class="over-inner">
    <h1 id="winnerTitle">-</h1>
    <p id="winnerMsg"></p>
    <div id="individualWins"></div>
    <div id="finalRoles" class="final-roles"></div>
    <button id="overHome" class="btn primary">Back to Village</button>
  </div>
</section>

<div id="guideModal" class="modal hidden">
  <div class="modal-card">
    <button id="guideClose" class="btn tiny">✕ Close</button>
    <div id="guideBody"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="art.js"></script>
<script src="client.js"></script>
</body>
</html>
